<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Lingwave mark</title>
  <desc id="desc">A neon Lw wave mark with an orange to pink to lavender gradient.</desc>
  <defs>
    <linearGradient id="lingwave-gradient" x1="66" y1="106" x2="476" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6a1a"/>
      <stop offset="0.42" stop-color="#ff3d8a"/>
      <stop offset="0.74" stop-color="#b662ff"/>
      <stop offset="1" stop-color="#d9b6ff"/>
    </linearGradient>
    <linearGradient id="lingwave-highlight" x1="84" y1="114" x2="466" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1ce"/>
      <stop offset="0.38" stop-color="#ffd4de"/>
      <stop offset="0.72" stop-color="#f0c7ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="lingwave-glow" x="-20%" y="-35%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95 0 1 0 0 0.18 0 0 1 0 0.72 0 0 0 0.72 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path
    d="M112 91v229c0 76 62 137 143 137 72 0 113-37 144-111 17-41 48-44 68-11l23 38"
    fill="none"
    stroke="url(#lingwave-gradient)"
    stroke-width="84"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#lingwave-glow)"
  />
  <path
    d="M112 91v229c0 76 62 137 143 137 72 0 113-37 144-111 17-41 48-44 68-11l23 38"
    fill="none"
    stroke="url(#lingwave-gradient)"
    stroke-width="62"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M112 91v229c0 76 62 137 143 137 72 0 113-37 144-111 17-41 48-44 68-11l23 38"
    fill="none"
    stroke="url(#lingwave-highlight)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity=".82"
  />
  <path
    d="M112 91v229c0 76 62 137 143 137 72 0 113-37 144-111 17-41 48-44 68-11l23 38"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
