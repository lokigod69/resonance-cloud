<!doctype html>
<html lang="en" class="theme-cosmos dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>first-light-fixtures</title>
    <script>
      // Installed before any module loads so every rAF consumer (framer-motion,
      // LingwaveWaves, TidelineBuoys) is counted — the reduced-motion fixture
      // reads this to prove the buoy loop is not churning.
      window.__rafCount = 0
      var __rawRaf = window.requestAnimationFrame.bind(window)
      window.requestAnimationFrame = function (cb) {
        window.__rafCount++
        return __rawRaf(cb)
      }
    </script>
    <style>
      html, body { margin: 0; padding: 0; min-height: 100%; }
      body {
        background: var(--app-bg, #0e0810);
        color: var(--text-primary, #fff7f4);
        font-family: 'Nunito', system-ui, sans-serif;
      }
      /* The harness never scrolls: fixtures assert on a single viewport. */
      #verdict { display: none; }
    </style>
  </head>
  <body class="skin-glassy">
    <!-- Stand-in for PolishGlassLayout's desktop top-nav right slot (§7). -->
    <div id="app-topnav-right-slot"></div>
    <div id="root"></div>
    <pre id="verdict"></pre>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
